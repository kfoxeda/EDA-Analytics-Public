<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDA Cost Code Dictionary</title>
<style>
  :root{
    --red:#C00000; --blue:#34657F; --gold:#D47E00;
    --ink:#1B2A32; --paper:#F7F5F1; --line:#DAD5CB; --muted:#6B7680; --green:#3E7A4F;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI', Tahoma, sans-serif; background:var(--paper); color:var(--ink); padding-bottom:40px; }
  header{
    background:var(--blue); color:#fff; padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:20;
  }
  header .title h1{ margin:0; font-size:18px; letter-spacing:.02em; font-weight:700; }
  header .title .sub{ font-size:11.5px; color:#D9E5EA; margin-top:2px; }
  .header-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .rules-btn{
    background:#fff; color:var(--blue); border:none; border-radius:20px; padding:9px 16px;
    font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .lang-toggle{
    display:flex; background:rgba(255,255,255,.15); border-radius:20px; padding:3px; gap:2px;
  }
  .lang-btn{
    background:none; border:none; color:#D9E5EA; border-radius:16px; padding:6px 12px;
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .lang-btn.active{ background:#fff; color:var(--blue); }
  .container{ max-width:1020px; margin:0 auto; padding:18px 16px 0; }
  .searchbar{ display:flex; gap:10px; margin-bottom:12px; }
  .searchbar input{
    flex:1; padding:12px 14px; font-size:15px; border:1.5px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .searchbar input:focus{ outline:none; border-color:var(--blue); }
  .type-filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .type-chip{
    padding:6px 12px; font-size:12.5px; border-radius:20px; border:1.5px solid var(--line);
    background:#fff; color:var(--muted); cursor:pointer; user-select:none;
  }
  .type-chip.active{ background:var(--blue); border-color:var(--blue); color:#fff; }

  .col-header{ display:flex; gap:12px; padding:6px 16px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  .col-trade{ width:56px; flex-shrink:0; }
  .col-code{ width:52px; flex-shrink:0; }
  .col-cat{ flex:1; }
  .col-status{ width:74px; flex-shrink:0; text-align:right; }

  .phase-group{ margin-bottom:12px; border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; }
  .phase-header{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; }
  .phase-header:hover{ background:#FBFAF8; }
  .phase-left{ display:flex; align-items:center; gap:12px; }
  .phase-code{
    font-family:'Consolas', monospace; font-weight:700; font-size:12.5px; color:var(--red);
    background:#FBEAEA; padding:4px 8px; border-radius:4px; min-width:52px; text-align:center;
  }
  .phase-name{ font-weight:600; font-size:14.5px; }
  .phase-meta{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .phase-default-trade{ font-family:'Consolas', monospace; font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; border:1px solid currentColor; }
  .trade-toggle{ display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .trade-toggle-chip{
    font-family:'Consolas', monospace; font-weight:700; font-size:11px;
    padding:3px 9px; border-radius:12px; border:1.5px solid; background:#fff; cursor:pointer;
  }
  .phase-def{ font-size:11.5px; color:var(--muted); margin-top:4px; max-width:640px; }
  .phase-usage{
    font-size:11.5px; color:var(--ink); margin-top:6px; padding:8px 10px; max-width:640px;
    background:#F7F5F1; border-left:3px solid var(--blue);
  }
  .caret{ color:var(--muted); transition:transform .15s ease; font-size:11px; flex-shrink:0; }
  .phase-group.open .caret{ transform:rotate(90deg); }
  .category-list{ display:none; border-top:1px solid var(--line); }
  .phase-group.open .category-list{ display:block; }

  .category-row{ display:flex; align-items:flex-start; gap:12px; padding:11px 16px; border-top:1px solid #EFECE5; cursor:pointer; }
  .category-row:hover{ background:#FBFAF8; }
  .trade-cell{ width:56px; flex-shrink:0; }
  .trade-chip{ display:inline-flex; align-items:center; gap:4px; font-family:'Consolas', monospace; font-weight:700; font-size:11px; padding:3px 8px; border-radius:12px; }
  .category-code{
    width:52px; flex-shrink:0; font-family:'Consolas', monospace; font-size:11.5px; font-weight:700;
    color:var(--blue); background:#EAF0F2; padding:3px 6px; border-radius:4px; text-align:center; margin-top:1px; height:fit-content;
  }
  .category-body{ flex:1; min-width:0; }
  .category-name{ font-size:13px; font-weight:600; }
  .category-shared-tag{ font-size:9.5px; font-weight:700; color:var(--blue); background:#EAF0F2; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:1px; }
  .category-range-tag{ font-size:9.5px; font-weight:700; color:var(--muted); background:#EFECE5; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:1px; }
  .category-desc{ font-size:12px; color:var(--muted); margin-top:2px; display:none; }
  .category-row.expanded .category-desc{ display:block; }
  .category-usage{ font-size:11.5px; color:var(--ink); margin-top:6px; padding:8px 10px; background:#F7F5F1; border-left:3px solid var(--gold); display:none; }
  .category-row.expanded .category-usage{ display:block; }
  .category-status{ width:74px; flex-shrink:0; text-align:right; font-size:10.5px; font-weight:700; padding-top:2px; }
  .category-section-label{
    padding:8px 16px 4px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); background:#FBFAF8; border-top:1px solid var(--line);
  }
  .category-list .category-section-label:first-child{ border-top:none; }
  .category-section-label.optional-toggle{
    cursor:pointer; display:flex; align-items:center; gap:6px; padding:10px 16px;
  }
  .section-caret{ font-size:9px; transition:transform .15s ease; }
  .section-caret.open{ transform:rotate(90deg); }
  .category-full-code{
    font-family:'Consolas', monospace; font-weight:700; font-size:12px; color:var(--red);
    background:#FBEAEA; display:inline-block; padding:2px 8px; border-radius:4px; margin-bottom:6px;
  }
  .status-Default{ color:var(--green); }
  .status-Optional{ color:var(--muted); }

  .no-results{ text-align:center; color:var(--muted); padding:40px 0; font-size:14px; }
  .note{ margin-top:24px; font-size:11px; color:var(--muted); text-align:center; }

  @media (max-width:600px){
    .col-header{ display:none; }
    .trade-cell{ width:auto; }
    .category-code{ width:auto; }
    .category-status{ width:auto; margin-left:auto; }
    .category-row{ flex-wrap:wrap; }
    header{ flex-wrap:wrap; }
  }

  .panel-overlay{ display:none; position:fixed; inset:0; background:rgba(27,42,50,.55); z-index:50; }
  .panel-overlay.open{ display:block; }
  .panel{
    position:fixed; top:0; right:0; bottom:0; width:100%; max-width:480px; background:var(--paper);
    z-index:51; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s ease;
  }
  .panel-overlay.open .panel{ transform:translateX(0); }
  .panel-head{ background:var(--blue); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .panel-head h2{ margin:0; font-size:16px; font-weight:700; }
  .panel-close{ background:none; border:none; color:#fff; font-size:22px; line-height:1; cursor:pointer; padding:4px; }
  .panel-tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); flex-shrink:0; }
  .panel-tab{ flex:1; padding:12px 6px; text-align:center; font-size:11.5px; font-weight:700; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .panel-tab.active{ color:var(--blue); border-bottom-color:var(--blue); }
  .panel-body{ flex:1; overflow-y:auto; padding:18px; }
  .panel-tab-content{ display:none; }
  .panel-tab-content.active{ display:block; }

  .anatomy-example{ display:flex; gap:2px; margin-bottom:16px; font-family:'Consolas', monospace; font-weight:700; font-size:19px; flex-wrap:wrap; align-items:center; }
  .anatomy-seg{ padding:6px 8px; border-radius:6px; cursor:pointer; border:2px solid transparent; background:#fff; }
  .anatomy-seg.sep{ padding:6px 2px; cursor:default; color:var(--muted); background:none; }
  .anatomy-seg.active{ border-color:currentColor; }
  .anatomy-seg[data-key="trade"]{ color:var(--red); }
  .anatomy-seg[data-key="phase"]{ color:var(--blue); }
  .anatomy-seg[data-key="category"]{ color:var(--gold); }
  .anatomy-seg[data-key="suffix"]{ color:var(--green); }
  .anatomy-labels{ display:flex; gap:2px; margin-bottom:16px; flex-wrap:wrap; }
  .anatomy-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); text-align:center; padding-top:2px; }
  .anatomy-detail{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; font-size:13px; line-height:1.5; min-height:70px; }
  .anatomy-detail .d-label{ font-weight:700; margin-bottom:4px; font-size:13px; }
  .anatomy-detail .d-extra{ color:var(--muted); font-size:12px; margin-top:6px; }
  .anatomy-hint{ font-size:11.5px; color:var(--muted); margin-bottom:14px; }
  .trade-ref-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; }
  .trade-ref-row:first-of-type{ border-top:none; }
  .trade-ref-letter{
    font-family:'Consolas', monospace; font-weight:700; font-size:12px; width:24px; height:24px; border-radius:5px;
    display:flex; align-items:center; justify-content:center; background:var(--paper); border:1px solid var(--line); flex-shrink:0;
  }
  .rules-list-panel{ padding-left:20px; font-size:13px; line-height:1.7; margin:0; }
  .rule-row{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .rule-row:first-child{ border-top:none; }
  .rule-num{ font-weight:700; font-size:13px; color:var(--muted); flex-shrink:0; width:16px; }
  .rule-body{ flex:1; }
  .rule-text{ font-size:13px; line-height:1.55; }
  .rule-tags{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .rule-tag{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:2px 8px; border-radius:10px;
  }
  .rule-tag-trade{ background:#FBEAEA; color:var(--red); }
  .rule-tag-phase{ background:#EAF0F2; color:var(--blue); }
  .rule-tag-category{ background:#FCEFDD; color:var(--gold); }
  .rule-tag-suffix{ background:#E8F1EA; color:var(--green); }
  .rule-filter-bar{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .rule-filter{
    font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:14px;
    border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; user-select:none;
  }
  .rule-filter.active{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .rules-callout{ background:#fff; border:1px solid var(--red); border-radius:6px; padding:10px 12px; font-size:12.5px; margin-top:14px; color:var(--ink); }
  .rules-section-title{ font-size:13px; font-weight:700; color:var(--blue); margin:18px 0 8px; }
  .suffix-example{ font-size:12px; font-family:'Consolas', monospace; padding:6px 10px; border-radius:5px; margin:4px 0; }
  .suffix-good{ background:#E8F1EA; color:var(--green); }
  .suffix-bad{ background:#FBEAEA; color:var(--red); }
  .suffix-subnote{ font-size:11px; color:var(--muted); margin:2px 0 8px 14px; line-height:1.5; }
  .reserved-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px; }
  .reserved-table th{ text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted); padding:4px 6px; border-bottom:1px solid var(--line); }
  .reserved-table td{ padding:7px 6px; border-bottom:1px solid #EFECE5; }
  .reserved-code{ font-family:'Consolas', monospace; font-weight:700; color:var(--blue); }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1 id="pageTitle">EDA Cost Code Dictionary</h1>
    <div class="sub" id="headerSub"></div>
  </div>
  <div class="header-actions">
    <div class="lang-toggle">
      <button class="lang-btn" id="langBtnEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="langBtnEs" onclick="setLang('es')">ES</button>
    </div>
    <button class="rules-btn" id="anatomyRulesBtn" onclick="openPanel('anatomy')"></button>
  </div>
</header>

<div class="container">
  <div class="searchbar">
    <input id="searchInput" type="text" oninput="render()">
  </div>
  <div class="type-filters" id="typeFilters"></div>

  <div class="col-header">
    <div class="col-trade" id="colTrade"></div>
    <div class="col-code" id="colCode"></div>
    <div class="col-cat" id="colCat"></div>
    <div class="col-status" id="colStatus"></div>
  </div>

  <div id="results"></div>
  <div class="note" id="footerNote"></div>
</div>

<div class="panel-overlay" id="panelOverlay" onclick="if(event.target===this) closePanel()">
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <button class="panel-close" onclick="closePanel()">&times;</button>
    </div>
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="anatomy" onclick="switchTab('anatomy')" id="tabAnatomy"></div>
      <div class="panel-tab" data-tab="rules" onclick="switchTab('rules')" id="tabRules"></div>
      <div class="panel-tab" data-tab="suffix" onclick="switchTab('suffix')" id="tabSuffix"></div>
      <div class="panel-tab" data-tab="history" onclick="switchTab('history')" id="tabHistory"></div>
    </div>
    <div class="panel-body">

      <div class="panel-tab-content active" data-content="anatomy">
        <div class="anatomy-hint" id="anatomyHint"></div>
        <div class="anatomy-example" id="anatomyExample"></div>
        <div class="anatomy-labels" id="anatomyLabels"></div>
        <div class="anatomy-detail" id="anatomyDetail"></div>
        <div class="rules-section-title" id="tradeRefTitle"></div>
        <table class="reserved-table" id="tradeRefTable"></table>

        <div class="rules-section-title" id="categoryRangeTitle"></div>
        <p style="font-size:12px; color:var(--muted); line-height:1.5;" id="categoryRangeHint"></p>
        <table class="reserved-table" id="categoryRangeTable"></table>
      </div>

      <div class="panel-tab-content" data-content="rules">
        <div id="rulesList"></div>
        <div class="rules-callout" id="rulesCallout"></div>
      </div>

      <div class="panel-tab-content" data-content="suffix">
        <div id="suffixGuideList"></div>

        <div class="rules-section-title" id="reservedSuffixTitle"></div>
        <p style="font-size:12px; color:var(--muted); line-height:1.5;" id="reservedSuffixHint"></p>
        <table class="reserved-table" id="reservedTable"></table>

        <div class="rules-callout" id="suffixCallout"></div>
      </div>

      <div class="panel-tab-content" data-content="history">
        <div class="rules-section-title" style="margin-top:0;" id="docInfoTitle"></div>
        <table class="reserved-table" id="metaTable"></table>

        <div class="rules-section-title" id="versionHistoryTitle"></div>
        <table class="reserved-table" id="changelogTable"></table>
      </div>

    </div>
  </div>
</div>

// =====================================================================================
// AppliesTo resolver — shared by applies_to_default / applies_to_optional
// on categories. Each token resolves to a {phaseNumber, tradeCode} entry.
// tradeCode is null when the token doesn't scope to one trade — meaning
// the category counts under that phase no matter which trade chip is
// currently selected. tradeCode is set when a token is fused with a
// trade letter, in which case the category only counts while that exact
// trade is toggled — this is what lets a phase that can be viewed under
// more than one trade (e.g. Pavers: R or M) show different categories
// per trade instead of the same full list under both.
//   (blank)        -> shared/general-conditions phases, any trade
//                      (any phase whose default_trade_code is blank or "—")
//   "NONE"         -> nothing — explicit "not applicable"
//   "ALL"          -> every phase, any trade
//   "R"            -> every phase whose default_trade_code is R (any trade viewing it)
//   "101,205"      -> explicit phase numbers, any trade
//   "100-199"      -> a phase-number range, any trade
//   "R101"         -> phase 101, but ONLY while trade R is the one toggled/selected
//   "R,101,M405,300-399" -> any mix of the above, comma-separated
// =====================================================================================
function resolveApplyEntries(str, phases){
  const trimmed = String(str || "").trim();
  const entries = [];

  if (trimmed === ""){
    phases.forEach(p => { if (isSharedTrade(p.default_trade_code)) entries.push({ phaseNumber: p.phase_number, tradeCode: null }); });
    return entries;
  }
  if (trimmed.toUpperCase() === "NONE"){
    return entries;
  }

  const tokens = trimmed.split(',').map(t => t.trim()).filter(Boolean);
  for (const token of tokens){
    if (token.toUpperCase() === 'ALL'){
      phases.forEach(p => entries.push({ phaseNumber: p.phase_number, tradeCode: null }));
      continue;
    }
    // fused trade + phase, e.g. "R101" or "M405" -> scoped to that one trade
    const fusedMatch = token.match(/^([A-Z—])(\d{3})$/i);
    if (fusedMatch){
      entries.push({ phaseNumber: fusedMatch[2], tradeCode: fusedMatch[1].toUpperCase() });
      continue;
    }
    // bare trade letter -> every phase that trade can appear on (as its
    // default OR as one of its alt trades), but ONLY while that trade is
    // the one currently toggled — otherwise a trade-wide category (e.g.
    // "General Roofing Labor" tagged just "R") would stay stuck showing
    // even after switching a shared phase's toggle to a different trade.
    if (/^[A-Z—]$/i.test(token)){
      const letter = token.toUpperCase();
      phases.forEach(p => { if (tradesForPhase(p).includes(letter)) entries.push({ phaseNumber: p.phase_number, tradeCode: letter }); });
      continue;
    }
    const rangeMatch = token.match(/^(\d{3})-(\d{3})$/);
    if (rangeMatch){
      const lo = parseInt(rangeMatch[1], 10), hi = parseInt(rangeMatch[2], 10);
      phases.forEach(p => { const n = parseInt(p.phase_number, 10); if (n >= lo && n <= hi) entries.push({ phaseNumber: p.phase_number, tradeCode: null }); });
      continue;
    }
    entries.push({ phaseNumber: token, tradeCode: null });
  }
  return entries;
}

// Back-compat helper: just the phase numbers a string resolves to,
// ignoring trade scoping — used wherever only "is this category assigned
// to this phase at all" matters, not which trade.
function resolvePhaseNumbers(str, phases){
  return new Set(resolveApplyEntries(str, phases).map(e => e.phaseNumber));
}

function categoriesForPhase(phase, categories, phases, currentTrade){
  // Dedupe by category_number so a category never appears twice under
  // the same phase — if it resolves as both Default and Optional
  // (whether from one row's overlapping fields or from duplicate rows
  // sharing a category_number), Default always wins.
  const byNumber = new Map();
  const matchesPhaseAndTrade = (entries) => entries.some(e =>
    e.phaseNumber === phase.phase_number && (e.tradeCode === null || e.tradeCode === currentTrade)
  );

  categories.forEach(c => {
    const defEntries = resolveApplyEntries(c.applies_to_default, phases);
    const optEntries = resolveApplyEntries(c.applies_to_optional, phases);
    let status = null;
    if (matchesPhaseAndTrade(defEntries)) status = "Default";
    else if (matchesPhaseAndTrade(optEntries)) status = "Optional";
    if (!status) return;

    const distinctPhases = new Set([...defEntries, ...optEntries].map(e => e.phaseNumber));
    const existing = byNumber.get(c.category_number);
    const isUpgrade = existing && existing.categoryStatus === "Optional" && status === "Default";
    if (!existing || isUpgrade){
      byNumber.set(c.category_number, { ...c, categoryStatus: status, sharedAcross: distinctPhases.size > 1 });
    }
  });
  return [...byNumber.values()];
}

function tradesForPhase(phase){
  const alt = phase.alt_trade_codes ? String(phase.alt_trade_codes).split(',').map(t => t.trim()).filter(Boolean) : [];
  return [phase.default_trade_code, ...alt];
}

  if (openPhases.has(phaseNumber)) openPhases.delete(phaseNumber);

function combineDefinition(c, phase, tradeCode){
  let d = tf(c, 'category_definition').trim();
  if (d.endsWith(".")) d = d.slice(0, -1) + ",";
  const phaseDesc = tf(phase, 'phase_description');
  const tradeLabel = tf(tradeByCode(tradeCode), 'trade_label');
  if (currentLang === 'es'){
    return `${d} para ${phaseDesc} en el alcance de ${tradeLabel}.`;
  }
  return `${d} for ${phaseDesc} in ${tradeLabel} scope.`;
}

function categoryRowHtml(c, current, phase){
  const s = ui();
  const fullCode = `${isSharedTrade(current) ? "" : current}${phase.phase_number}.${c.category_number}`;
  const combinedDef = combineDefinition(c, phase, current);
  const statusLabel = c.categoryStatus === "Default" ? s.default : s.optional;
  return `
    <div class="category-row" onclick="this.classList.toggle('expanded'); event.stopPropagation();">
      <div class="trade-cell">${tradeChip(current)}</div>
      <div class="category-code">${c.category_number}</div>
      <div class="category-body">
        <div class="category-name">${tf(c, 'category_description')}<span class="category-range-tag">${tf(c, 'category_range_label')}</span>${c.sharedAcross ? `<span class="category-shared-tag">${s.shared}</span>` : ''}</div>
        <div class="category-desc">
          <div class="category-full-code">${fullCode}</div>
          <div>${combinedDef}</div>
        </div>
        ${c.category_usage ? `<div class="category-usage"><strong>${s.usage}</strong> ${tf(c, 'category_usage')}</div>` : ''}
      </div>
      <div class="category-status status-${c.categoryStatus}">${statusLabel}</div>
    </div>`;
}

function toggleOptionalSection(phaseNumber){
  if (openOptionalSections.has(phaseNumber)) openOptionalSections.delete(phaseNumber);
  else openOptionalSections.add(phaseNumber);
  render();
}

function buildPhaseGroupHtml(phase, catsToShow, isOpen, forceOpenOptional){
  const s = ui();
  const current = selectedTrade[phase.phase_number] || phase.default_trade_code;
  const currentColor = colorFor(current);
  const currentLabel = tf(tradeByCode(current), 'trade_label');
  const trades = tradesForPhase(phase);
  const onAltTrade = current !== phase.default_trade_code;
  const displayName = onAltTrade ? `${currentLabel} ${tf(phase, 'phase_description')}` : tf(phase, 'phase_description');

  const tradeToggle = trades.length > 1 ? `
    <div class="trade-toggle">
      ${trades.map(code => {
        const c = colorFor(code);
        const active = code === current;
        return `<span class="trade-toggle-chip ${active ? 'active' : ''}"
          style="${active ? `background:${c}; border-color:${c}; color:#fff;` : `color:${c}; border-color:${c};`}"
          onclick="event.stopPropagation(); selectPhaseTrade('${phase.phase_number}','${code}')">${code}</span>`;
      }).join('')}
    </div>` : '';

  const defaultCats = catsToShow.filter(c => c.categoryStatus === "Default");
  const optionalCats = catsToShow.filter(c => c.categoryStatus === "Optional");
  const optionalOpen = forceOpenOptional || openOptionalSections.has(phase.phase_number);

  let categoryListHtml;
  if (!catsToShow.length){
    categoryListHtml = `<div style="padding:14px 16px; font-size:12px; color:var(--muted);">${s.noCategories}</div>`;
  } else {
    categoryListHtml = '';
    if (defaultCats.length){
      categoryListHtml += `<div class="category-section-label">${s.default}</div>` + defaultCats.map(c => categoryRowHtml(c, current, phase)).join('');
    }
    if (optionalCats.length){
      categoryListHtml += `<div class="category-section-label optional-toggle" onclick="event.stopPropagation(); toggleOptionalSection('${phase.phase_number}')">
        ${s.optional} (${optionalCats.length})
        <span class="section-caret ${optionalOpen ? 'open' : ''}">▶</span>
      </div>`;
      if (optionalOpen){
        categoryListHtml += optionalCats.map(c => categoryRowHtml(c, current, phase)).join('');
      }
    }
  }

  return `<div class="phase-group ${isOpen ? 'open' : ''}">
    <div class="phase-header" onclick="togglePhaseOpen('${phase.phase_number}')">
      <div class="phase-left">
        <div class="phase-code">${isSharedTrade(current) ? "" : current}${phase.phase_number}</div>
        <div>
          <div class="phase-name">${displayName}</div>
          <div class="phase-meta">
            ${tf(phase, 'default_trade_label')} ·
            <span class="phase-default-trade" style="color:${currentColor};">${s.viewing} ${current}${current === phase.default_trade_code ? ' ' + s.defaultTag : ''}</span>
          </div>
          ${tradeToggle}
          <div class="phase-def">${tf(phase, 'phase_definition')}</div>
          ${phase.phase_usage ? `<div class="phase-usage"><strong>${s.usage}</strong> ${tf(phase, 'phase_usage')}</div>` : ''}
        </div>
      </div>
      <div class="caret">▶</div>
    </div>
    <div class="category-list">
      ${categoryListHtml}
    </div>
  </div>`;
}

function render(){
  const s = ui();
  const q = document.getElementById('searchInput').value.trim();
  const container = document.getElementById('results');
  let any = false;
  let html = '';

  PHASES.forEach(phase => {
    if (activeType && phase.default_trade_label !== activeType) return;

    const currentTrade = selectedTrade[phase.phase_number] || phase.default_trade_code;
    const phaseCats = categoriesForPhase(phase, CATEGORIES, PHASES, currentTrade);
    const phaseMatch = !q || matches(tf(phase, 'phase_description'), q) || matches(phase.phase_number, q)
      || matches(tf(phase, 'default_trade_label'), q);
    const catMatches = phaseCats.filter(c =>
      !q || matches(tf(c, 'category_description'), q) || matches(c.category_number, q) || matches(tf(c, 'category_definition'), q)
    );

    if (!q || phaseMatch || catMatches.length){
      any = true;
      const catsToShow = (!q || phaseMatch) ? phaseCats : catMatches;
      const isOpen = q ? true : openPhases.has(phase.phase_number);
      html += buildPhaseGroupHtml(phase, catsToShow, isOpen, !!q);
    }
  });

  container.innerHTML = any ? html : `<div class="no-results">${s.noResults}</div>`;
}

// =====================================================================================
// Anatomy panel — driven by ANATOMY_SEGMENTS (tbl_anatomy), sorted by segment_order
// =====================================================================================
function renderAnatomy(){
  const segments = [...ANATOMY_SEGMENTS].sort((a, b) => a.segment_order - b.segment_order);
  const ex = document.getElementById('anatomyExample');
  const labels = document.getElementById('anatomyLabels');
  ex.innerHTML = segments.map(a =>
    a.is_separator === "Y" ? `<div class="anatomy-seg sep">${a.example}</div>`
          : `<div class="anatomy-seg" data-key="${a.segment_key}" onclick="selectAnatomy('${a.segment_key}')">${a.example}</div>`
  ).join('');
  labels.innerHTML = segments.map(a =>
    `<div class="anatomy-label" style="width:${a.example.length * 13 + 16}px;">${a.is_separator === "Y" ? '' : tf(a, 'segment_label')}</div>`
  ).join('');
  const firstSelectable = segments.find(a => a.is_separator !== "Y");
  if (firstSelectable) selectAnatomy(firstSelectable.segment_key);
}
function selectAnatomy(key){
  document.querySelectorAll('.anatomy-seg').forEach(el => el.classList.toggle('active', el.dataset.key === key));
  const a = ANATOMY_SEGMENTS.find(x => x.segment_key === key);
  document.getElementById('anatomyDetail').innerHTML = `
    <div class="d-label">${tf(a, 'segment_label')}</div>
    <div class="d-desc">${tf(a, 'segment_description')}</div>
    ${a.segment_notes ? `<div class="d-extra">${tf(a, 'segment_notes')}</div>` : ''}
  `;
}
function renderTradeRef(){
  const s = ui();
  const el = document.getElementById('tradeRefTable');
  el.innerHTML = `<tr><th>${s.thCode}</th><th>${s.thTradeRange}</th></tr>` +
    TRADES.map(t => `
      <tr><td class="reserved-code">${t.trade_code}</td><td>
        <strong>${tf(t, 'trade_label')}</strong> — ${t.phase_range_start}–${t.phase_range_end}
        <br><span style="color:var(--muted); font-size:11px;">${tf(t, 'phase_range_notes')}</span>
      </td></tr>`
    ).join('');
}
function renderSuffixGuide(){
  const el = document.getElementById('suffixGuideList');
  const sorted = [...SUFFIX_GUIDE].sort((a, b) => a.guide_order - b.guide_order);
  el.innerHTML = sorted.map(g => {
    const text = tf(g, 'guide_text');
    if (g.guide_type === "good") return `<div class="suffix-example suffix-good">✓ ${text}</div>`;
    if (g.guide_type === "bad") return `<div class="suffix-example suffix-bad">✗ ${text}</div>`;
    if (g.guide_type === "subnote") return `<div class="suffix-subnote">${text}</div>`;
    if (g.guide_type === "note") return `<p style="font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:12px;">${text}</p>`;
    return `<p style="font-size:13px; line-height:1.6;">${text}</p>`;
  }).join('');
}
function renderReservedSuffixes(){
  const s = ui();
  const el = document.getElementById('reservedTable');
  el.innerHTML = `<tr><th>${s.thCode}</th><th>${s.thMeaning}</th></tr>` +
    RESERVED_SUFFIXES.map(r => `<tr><td class="reserved-code">${r.suffix_code}</td><td>${tf(r, 'suffix_meaning')}</td></tr>`).join('');
}
function renderCategoryRanges(){
  const s = ui();
  const el = document.getElementById('categoryRangeTable');
  el.innerHTML = `<tr><th>${s.thRange}</th><th>${s.thType}</th></tr>` +
    CATEGORY_RANGES.map(r => `<tr><td class="reserved-code">${r.category_range_start}–${r.category_range_end}</td><td>${tf(r, 'category_range_label')}<br><span style="color:var(--muted); font-size:11px;">${tf(r, 'category_range_notes')}</span></td></tr>`).join('');
}
function renderHeaderSub(){
  document.getElementById('headerSub').textContent = `v${META.version} · ${tf(META, 'status')}`;
}
function renderMeta(){
  const s = ui();
  const el = document.getElementById('metaTable');
  el.innerHTML = `
    <tr><th>${s.thField}</th><th>${s.thValue}</th></tr>
    <tr><td>${s.metaVersion}</td><td>${META.version}</td></tr>
    <tr><td>${s.metaEffective}</td><td>${META.effective_date}</td></tr>
    <tr><td>${s.metaStatus}</td><td>${tf(META, 'status')}</td></tr>
    <tr><td>${s.metaUpdatedBy}</td><td>${META.last_updated_by}</td></tr>
    <tr><td>${s.metaUpdated}</td><td>${META.last_updated_date}</td></tr>
  `;
}
function renderChangelog(){
  const s = ui();
  const el = document.getElementById('changelogTable');
  el.innerHTML = `<tr><th>${s.thVersion}</th><th>${s.thDate}</th><th>${s.thAuthor}</th><th>${s.thNotes}</th></tr>` +
    CHANGE_LOG.map(c => `<tr><td class="reserved-code">${c.version}</td><td>${c.change_date}</td><td>${c.author}</td><td>${tf(c, 'notes')}</td></tr>`).join('');
}

let activeRuleFilter = null;
function ruleTagHtml(tag){
  const s = ui();
  return `<span class="rule-tag rule-tag-${tag}">${s.ruleTags[tag] || tag}</span>`;
}
function renderRules(){
  const s = ui();
  const el = document.getElementById('rulesList');
  const filterBar = `<div class="rule-filter-bar">
    ${['trade','phase','category','suffix'].map(t =>
      `<div class="rule-filter ${activeRuleFilter===t?'active':''}" onclick="toggleRuleFilter('${t}')">${s.ruleTags[t]}</div>`
    ).join('')}
  </div>`;
  const rows = RULES
    .map(r => ({ ...r, tags: r.applies_to.split(',').map(x => x.trim()) }))
    .filter(r => !activeRuleFilter || r.tags.includes(activeRuleFilter));
  el.innerHTML = filterBar + rows.map(r => `
    <div class="rule-row">
      <div class="rule-num">${r.rule_number}.</div>
      <div class="rule-body">
        <div class="rule-text">${tf(r, 'rule_text')}</div>
        <div class="rule-tags">${r.tags.map(ruleTagHtml).join('')}</div>
      </div>
    </div>
  `).join('');
}
function toggleRuleFilter(t){
  activeRuleFilter = activeRuleFilter === t ? null : t;
  renderRules();
}
function openPanel(tab){ document.getElementById('panelOverlay').classList.add('open'); switchTab(tab || 'anatomy'); }
function closePanel(){ document.getElementById('panelOverlay').classList.remove('open'); }
function switchTab(tab){
  document.querySelectorAll('.panel-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.panel-tab-content').forEach(el => el.classList.toggle('active', el.dataset.content === tab));
}

setLang('en');
</script>
